<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secured Research Notes</title>

  <style>
    /* Prevent all text selection and highlighting */
    *, *::before, *::after {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
    }

    /* Blackout screen on print/PDF attempt */
    @media print {
      html, body {
        display: none !important;
      }
    }

    /* Lock Screen Overlay */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background-color: #0b0e14;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
    }

    .auth-card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .auth-card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #f0f6fc;
    }

    .auth-card input {
      width: 90%;
      padding: 10px;
      margin: 15px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
    }

    .auth-card input:focus {
      border-color: #58a6ff;
    }

    .btn {
      padding: 10px 15px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #2ea043;
    }

    #status-msg {
      margin-top: 15px;
      font-size: 13px;
      min-height: 18px;
    }

    /* Main Container */
    #main-wrapper {
      display: none;
      max-width: 850px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* Admin Control Panel */
    #admin-panel {
      display: none;
      background: #1f242c;
      border: 1px solid #388bfd;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 30px;
    }

    #admin-panel h3 {
      margin-top: 0;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      align-items: center;
      margin-top: 15px;
    }

    .admin-controls select {
      padding: 8px;
      background: #0d1117;
      border: 1px solid #30363d;
      color: #fff;
      border-radius: 6px;
    }

    .admin-controls label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    #generated-key-box {
      margin-top: 15px;
      padding: 12px;
      background: #0d1117;
      border: 1px dashed #238636;
      border-radius: 6px;
      display: none;
      font-family: monospace;
      color: #7ee787;
    }

    /* Content Area */
    #content-container {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 30px;
    }

    #content-container h1 {
      color: #f0f6fc;
      margin-top: 0;
    }

    #content-container hr {
      border: 0;
      border-top: 1px solid #30363d;
      margin: 20px 0;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Login Wall -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2>Restricted System</h2>
      <input type="password" id="pass-field" placeholder="Enter Access Code" autocomplete="off">
      <button class="btn" id="submit-btn" style="width: 96%;" onclick="verifySession()">Authorize</button>
      <div id="status-msg"></div>
    </div>
  </div>

  <div id="main-wrapper">
    <!-- Admin-Only Panel for Temporary Passwords -->
    <div id="admin-panel">
      <h3>🛡️ Admin Key Generator</h3>
      <p style="font-size: 13px; color: #8b949e; margin: 0;">Generate an expiring, one-time passcode for another user.</p>
      
      <div class="admin-controls">
        <label>
          Duration:
          <select id="key-duration">
            <option value="3600">1 Hour</option>
            <option value="21600">6 Hours</option>
            <option value="86400">24 Hours</option>
          </select>
        </label>

        <label>
          <input type="checkbox" id="key-single-use" checked> Single-Use (Destroys after 1 login)
        </label>

        <button class="btn" onclick="generateTempKey()">Create Key</button>
      </div>

      <div id="generated-key-box"></div>
    </div>

    <!-- Protected Notes Section -->
    <div id="content-container">
      <h1>Restricted Research Notes</h1>
      <hr>
      <p>Place your private notes, study materials, or documentation here.</p>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURATION
    // -------------------------------------------------------------
    const WORKER_URL = "https://notes-gatekeeper.gouravdhotriya.workers.dev";
    let activeAdminSecret = "";

    // -------------------------------------------------------------
    // CLIENT DETERRENTS (Anti-Copy / Anti-Inspect)
    // -------------------------------------------------------------
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      // Block Ctrl+C, Ctrl+X, Ctrl+U, Ctrl+P, Ctrl+S, Ctrl+A
      if (e.ctrlKey && ["c", "x", "u", "p", "s", "a"].includes(key)) {
        e.preventDefault();
        return false;
      }
      // Block F12 Inspect
      if (e.key === "F12") {
        e.preventDefault();
        return false;
      }
    });

    document.addEventListener("dragstart", (e) => e.preventDefault());
    document.addEventListener("copy", (e) => e.preventDefault());

    document.getElementById("pass-field").addEventListener("keypress", (e) => {
      if (e.key === "Enter") verifySession();
    });

    // -------------------------------------------------------------
    // AUTHENTICATION
    // -------------------------------------------------------------
    async function verifySession() {
      const passInput = document.getElementById("pass-field");
      const status = document.getElementById("status-msg");
      const btn = document.getElementById("submit-btn");
      const enteredPassword = passInput.value.trim();

      if (!enteredPassword) {
        status.style.color = "#f85149";
        status.innerText = "Password cannot be empty.";
        return;
      }

      btn.disabled = true;
      status.style.color = "#8b949e";
      status.innerText = "Verifying credentials & IP...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: enteredPassword })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          // Authentication Success
          document.getElementById("auth-overlay").remove();
          document.getElementById("main-wrapper").style.display = "block";

          // If Admin, reveal Admin Control Panel
          if (result.isAdmin) {
            activeAdminSecret = enteredPassword;
            document.getElementById("admin-panel").style.display = "block";
          }
        } else {
          executeKickout();
        }
      } catch (err) {
        executeKickout();
      }
    }

    // -------------------------------------------------------------
    // ADMIN: GENERATE TEMPORARY KEY
    // -------------------------------------------------------------
    async function generateTempKey() {
      const durationSeconds = document.getElementById("key-duration").value;
      const singleUse = document.getElementById("key-single-use").checked;
      const keyBox = document.getElementById("generated-key-box");

      keyBox.style.display = "block";
      keyBox.innerText = "Generating key in Cloudflare KV...";

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "create_temp_key",
            adminPassword: activeAdminSecret,
            durationSeconds: durationSeconds,
            singleUse: singleUse
          })
        });

        const data = await res.json();
        if (data.success) {
          keyBox.innerHTML = `
            <strong>Generated Key:</strong> <span style="font-size: 16px; color:#58a6ff;">${data.tempPassword}</span><br>
            <strong>Lifespan:</strong> ${data.expiresInMinutes} Minutes<br>
            <strong>Mode:</strong> ${data.singleUse ? "One-Time (Deletes after login)" : "Multi-Use until expired"}<br>
            <small style="color:#8b949e;">Send this passcode to your visitor. It will not work once expired.</small>
          `;
        } else {
          keyBox.innerText = "Failed to generate key.";
        }
      } catch (e) {
        keyBox.innerText = "Network error while generating key.";
      }
    }

    function executeKickout() {
      document.body.innerHTML = `
        <div style="background:#000; color:#ff3333; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:monospace;">
          <h1>ACCESS VIOLATION: IP RECORDED</h1>
          <p>Invalid or Expired credentials. Terminating session...</p>
        </div>
      `;

      setTimeout(() => {
        window.location.replace("https://www.google.com");
      }, 1000);
    }
  </script>
</body>
</html>
