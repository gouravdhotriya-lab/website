<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secured Notes</title>

  <style>
    /* Complete text-selection lockdown */
    *, *::before, *::after {
      -webkit-user-select: none !important;
      -moz-user-select: none !important;
      -ms-user-select: none !important;
      user-select: none !important;
      -webkit-touch-callout: none !important;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #c9d1d9;
    }

    /* Blackout screen on print/PDF export attempt */
    @media print {
      html, body {
        display: none !important;
      }
    }

    /* Authentication Modal */
    #auth-overlay {
      position: fixed;
      inset: 0;
      background-color: #0b0e14;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
    }

    .auth-card {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 30px;
      border-radius: 8px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .auth-card h2 {
      margin-top: 0;
      font-size: 1.25rem;
      color: #f0f6fc;
    }

    .auth-card input {
      width: 90%;
      padding: 10px;
      margin: 15px 0;
      background: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #f0f6fc;
      font-size: 14px;
      outline: none;
    }

    .auth-card input:focus {
      border-color: #58a6ff;
    }

    .auth-card button {
      width: 96%;
      padding: 10px;
      background-color: #238636;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .auth-card button:hover {
      background-color: #2ea043;
    }

    #status-msg {
      margin-top: 15px;
      font-size: 13px;
      min-height: 18px;
    }

    /* Secured Content Area */
    #content-container {
      display: none;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- Lock Screen Overlay -->
  <div id="auth-overlay">
    <div class="auth-card">
      <h2>Restricted System</h2>
      <input type="password" id="pass-field" placeholder="Enter Access Password" autocomplete="off">
      <button id="submit-btn" onclick="verifySession()">Authorize</button>
      <div id="status-msg"></div>
    </div>
  </div>

  <!-- Protected Notes (Hidden by Default) -->
  <div id="content-container">
    <h1>Private Notes</h1>
    <hr style="border: 0; border-top: 1px solid #30363d; margin: 20px 0;">
    <p>Your protected notes content goes here.</p>
  </div>

  <script>
    // -------------------------------------------------------------
    // REPLACE THIS URL WITH YOUR DEPLOYED CLOUDFLARE WORKER LINK
    // -------------------------------------------------------------
    const WORKER_URL = "https://your-worker-name.your-subdomain.workers.dev";

    // -------------------------------------------------------------
    // CLIENT DETERRENTS (Anti-Copy / Anti-Inspect)
    // -------------------------------------------------------------
    // Disable right click context menu
    document.addEventListener("contextmenu", (e) => e.preventDefault());

    // Intercept common extraction keys
    document.addEventListener("keydown", (e) => {
      const key = e.key.toLowerCase();
      // Block Ctrl+C, Ctrl+X, Ctrl+U, Ctrl+P, Ctrl+S, Ctrl+A
      if (e.ctrlKey && ["c", "x", "u", "p", "s", "a"].includes(key)) {
        e.preventDefault();
        return false;
      }
      // Block F12 Inspect Element
      if (e.key === "F12") {
        e.preventDefault();
        return false;
      }
    });

    // Strip copy events
    document.addEventListener("copy", (e) => e.preventDefault());

    // Enter key triggers verification
    document.getElementById("pass-field").addEventListener("keypress", (e) => {
      if (e.key === "Enter") verifySession();
    });

    // -------------------------------------------------------------
    // AUTHENTICATION & KICK ENGINE
    // -------------------------------------------------------------
    async function verifySession() {
      const passInput = document.getElementById("pass-field");
      const status = document.getElementById("status-msg");
      const btn = document.getElementById("submit-btn");
      const enteredPassword = passInput.value;

      if (!enteredPassword) {
        status.style.color = "#f85149";
        status.innerText = "Password cannot be empty.";
        return;
      }

      btn.disabled = true;
      status.style.color = "#8b949e";
      status.innerText = "Verifying credentials & IP...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: enteredPassword })
        });

        const result = await response.json();

        if (response.ok && result.success) {
          // Success: remove auth gate and reveal content
          document.getElementById("auth-overlay").remove();
          document.getElementById("content-container").style.display = "block";
        } else {
          // Password mismatch: execute kickout
          executeKickout();
        }
      } catch (err) {
        // Any request failure, blocked connection, or tampering triggers kickout
        executeKickout();
      }
    }

    function executeKickout() {
      // 1. Wipe page content immediately
      document.body.innerHTML = `
        <div style="background:#000; color:#ff3333; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:monospace;">
          <h1>ACCESS VIOLATION: IP RECORDED</h1>
          <p>Mismatched credentials. Terminating session...</p>
        </div>
      `;

      // 2. Redirect away after 1 second
      setTimeout(() => {
        window.location.replace("https://www.google.com");
      }, 1000);
    }
  </script>
</body>
</html>
