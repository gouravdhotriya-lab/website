<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secured Workspace</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --border: #23314f;
      --text: #e2e8f0;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #ef4444;
      --success: #22c55e;
      --reader-size: 16px;
      --reader-weight: 400;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Blackout on Print / Save */
    @media print {
      html, body { display: none !important; }
    }

    /* Full-Screen Watermark Layer for Guests */
    #watermark-overlay {
      display: none;
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.12;
      background-repeat: repeat;
      background-size: 320px 200px;
    }

    /* Login Modal */
    #auth-screen {
      position: fixed;
      inset: 0;
      background: #060911;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10000;
    }
    .auth-box {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.7);
    }
    .auth-box h2 {
      margin-bottom: 20px;
      color: #fff;
      font-size: 1.4rem;
    }
    .auth-box input {
      width: 100%;
      padding: 12px;
      background: #090d16;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: #fff;
      font-size: 15px;
      margin-bottom: 16px;
      outline: none;
    }
    .auth-box input:focus {
      border-color: var(--accent);
    }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-primary { background: var(--accent); color: #04101e; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #1c2742; }
    .btn-sm { padding: 4px 10px; font-size: 11px; }

    /* Top Navigation Bar */
    header {
      background: #0f172a;
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .breadcrumb {
      font-size: 14px;
      color: #94a3b8;
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .breadcrumb span.active { color: var(--accent); font-weight: 600; }
    .breadcrumb a { color: #94a3b8; text-decoration: none; cursor: pointer; }
    .breadcrumb a:hover { color: #fff; }

    /* Main Container */
    #app-container {
      display: none;
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }

    /* Admin Key Management Bar */
    #admin-bar {
      display: none;
      background: #111a33;
      border: 1px solid #1e3a8a;
      border-radius: 8px;
      padding: 16px 20px;
      margin-bottom: 24px;
    }
    .admin-bar-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .key-table-wrapper {
      margin-top: 16px;
      border-top: 1px solid #1e293b;
      padding-top: 12px;
      display: none;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-top: 8px;
    }
    th, td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid #1e293b;
    }
    th { color: #94a3b8; font-weight: 500; }

    /* View 1: Subject Cards */
    .grid-view {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }
    .card h3 {
      font-size: 1.15rem;
      color: #fff;
      margin-bottom: 8px;
    }
    .card-meta {
      font-size: 12px;
      color: #94a3b8;
    }
    .card-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
    }

    /* View 2: Chapter List */
    .chapter-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
    }
    .chapter-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }
    .chapter-item:hover { border-color: var(--accent); }
    .chapter-title {
      font-size: 15px;
      font-weight: 500;
      color: #fff;
    }
    .chapter-page {
      background: #1e293b;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 12px;
      color: #94a3b8;
      margin-left: 10px;
    }

    /* View 3: Reader View */
    #reader-view {
      display: none;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 36px;
      margin-top: 20px;
      position: relative;
    }
    .reader-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .reader-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #note-content {
      font-size: var(--reader-size);
      font-weight: var(--reader-weight);
      line-height: 1.8;
      color: #f1f5f9;
      min-height: 400px;
      outline: none;
      white-space: pre-wrap;
    }

    /* Anti-Camera Optical Interference Grid */
    .anti-capture-pattern {
      background-image: radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 0);
      background-size: 8px 8px;
    }
  </style>
</head>
<body>

  <!-- Dynamic Watermark Canvas Overlay -->
  <div id="watermark-overlay"></div>

  <!-- Gateway Login Window -->
  <div id="auth-screen">
    <div class="auth-box">
      <h2>Restricted Access</h2>
      <input type="password" id="pass-input" placeholder="Enter Access Key..." autocomplete="off">
      <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="attemptLogin()">Enter Portal</button>
      <div id="auth-error" style="color: var(--danger); font-size: 13px; margin-top: 14px; min-height: 18px;"></div>
    </div>
  </div>

  <!-- Main System Wrapper -->
  <header>
    <div class="breadcrumb" id="breadcrumb-bar">
      <span class="active">Subjects</span>
    </div>
    <div style="display: flex; gap: 10px; align-items: center;">
      <span id="user-badge" style="font-size: 12px; color: #94a3b8;"></span>
      <button class="btn btn-outline btn-sm" onclick="logout()">Exit</button>
    </div>
  </header>

  <div id="app-container">

    <!-- Admin Master Control Panel -->
    <div id="admin-bar">
      <div class="admin-bar-row">
        <div>
          <strong style="color: var(--accent);">Admin Operations</strong>
          <span style="font-size: 12px; color: #94a3b8; margin-left: 8px;">Unrestricted Mode Active</span>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-outline btn-sm" onclick="toggleKeyManager()">Manage Temp Keys</button>
          <button class="btn btn-primary btn-sm" onclick="promptCreateKey()">+ New Temp Key</button>
          <button class="btn btn-outline btn-sm" style="border-color: var(--success); color: var(--success);" onclick="persistAllNotes()">Save Notes to Cloud</button>
        </div>
      </div>

      <!-- Real-Time Key Management & Instant Revocation List -->
      <div class="key-table-wrapper" id="key-table-box">
        <table>
          <thead>
            <tr>
              <th>Assigned Name</th>
              <th>Access Key</th>
              <th>Expires</th>
              <th>Bound IP</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="key-table-body"></tbody>
        </table>
      </div>
    </div>

    <!-- View 1: Subject Window -->
    <div id="subjects-view">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Subjects</h2>
        <button class="btn btn-outline btn-sm admin-only" onclick="createSubject()">+ New Subject</button>
      </div>
      <div class="grid-view" id="subjects-grid"></div>
    </div>

    <!-- View 2: Chapter Index Window -->
    <div id="chapters-view" style="display: none;">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 id="current-subject-title">Chapters</h2>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-outline btn-sm" onclick="showSubjects()">← Back to Subjects</button>
          <button class="btn btn-primary btn-sm admin-only" onclick="createChapter()">+ New Chapter</button>
        </div>
      </div>
      <div class="chapter-list" id="chapters-list"></div>
    </div>

    <!-- View 3: Scrollable Reader Window -->
    <div id="reader-view">
      <div class="reader-toolbar">
        <div>
          <h2 id="reader-chapter-title" style="color: #fff; font-size: 1.3rem;"></h2>
          <span id="reader-page-badge" style="font-size: 12px; color: #94a3b8;"></span>
        </div>

        <div class="reader-controls">
          <label class="admin-only" style="font-size: 12px; color: #94a3b8;">Size:
            <input type="range" min="12" max="28" value="16" oninput="changeFontSize(this.value)" style="vertical-align: middle;">
          </label>
          <button class="btn btn-outline btn-sm admin-only" onclick="toggleBold()"><b>B</b></button>
          <button class="btn btn-outline btn-sm" onclick="showChapters()">Index</button>
        </div>
      </div>

      <!-- Scrollable Note Content Area -->
      <div id="note-content" class="anti-capture-pattern"></div>
    </div>

  </div>

  <script>
    // -------------------------------------------------------------
    // CONFIGURATION & GLOBAL STATE
    // -------------------------------------------------------------
    const WORKER_URL = "https://notes-gatekeeper.gouravdhotriya.workers.dev";

    let state = {
      isAdmin: false,
      token: "",
      guestName: "",
      clientIP: "",
      notes: { subjects: [] },
      activeSubjectId: null,
      activeChapterId: null,
      fontSize: 16,
      isBold: false
    };

    let heartbeatTimer = null;

    // -------------------------------------------------------------
    // ANTI-LEAK: INSTANT ONE-SHOT KICK FOR SCREENSHOTS
    // -------------------------------------------------------------
    function executeKickout(reason) {
      document.body.innerHTML = `
        <div style="background:#020617; color:#ef4444; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:monospace; text-align:center;">
          <h1 style="font-size:2rem; margin-bottom:12px;">SECURITY BREACH DETECTED</h1>
          <p style="color:#94a3b8;">${reason || "Unauthorized capture detected. Session terminated."}</p>
        </div>
      `;
      localStorage.clear();
      sessionStorage.clear();
      setTimeout(() => { window.location.replace("https://www.google.com"); }, 1000);
    }

    // Capture detection listeners for non-admin visitors
    window.addEventListener("keyup", (e) => {
      if (state.isAdmin) return;
      if (e.key === "PrintScreen") {
        executeKickout("PrintScreen Violation: Instant Session Revocation");
      }
    });

    window.addEventListener("keydown", (e) => {
      if (state.isAdmin) return;
      const key = e.key.toLowerCase();
      // Block common screenshot shortcuts
      if ((e.metaKey || e.ctrlKey) && (e.shiftKey && ["3", "4", "s"].includes(key))) {
        e.preventDefault();
        executeKickout("Capture Shortcut Detected");
      }
      // Block copy, inspect, cut, save
      if ((e.ctrlKey || e.metaKey) && ["c", "x", "u", "s", "p", "a"].includes(key)) {
        e.preventDefault();
      }
      if (e.key === "F12") {
        e.preventDefault();
      }
    });

    // One-shot kick if screen snip tool pulls focus or tab changes
    document.addEventListener("visibilitychange", () => {
      if (!state.isAdmin && document.hidden) {
        executeKickout("Display Focus Severed / Recording Detected");
      }
    });

    // Disable context menu and selection for guests only
    document.addEventListener("contextmenu", (e) => {
      if (!state.isAdmin) e.preventDefault();
    });
    document.addEventListener("selectstart", (e) => {
      if (!state.isAdmin) e.preventDefault();
    });

    // -------------------------------------------------------------
    // FORENSIC WATERMARK GENERATOR
    // -------------------------------------------------------------
    function generateWatermarkGrid(name, ip) {
      const canvas = document.createElement("canvas");
      canvas.width = 340;
      canvas.height = 180;
      const ctx = canvas.getContext("2d");
      ctx.rotate((-22 * Math.PI) / 180);
      ctx.font = "500 13px Roboto, sans-serif";
      ctx.fillStyle = "rgba(255, 255, 255, 0.18)";
      const dateStr = new Date().toLocaleDateString("en-IN");
      ctx.fillText(`${name} • ${ip}`, -20, 90);
      ctx.fillText(`CONFIDENTIAL • ${dateStr}`, -20, 115);

      const overlay = document.getElementById("watermark-overlay");
      overlay.style.backgroundImage = `url(${canvas.toDataURL()})`;
      overlay.style.display = "block";
    }

    // -------------------------------------------------------------
    // REAL-TIME HEARTBEAT (Kicks revoked guests in 3 seconds)
    // -------------------------------------------------------------
    function startHeartbeat() {
      if (heartbeatTimer) clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(async () => {
        if (!state.token) return;
        try {
          const res = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              action: "heartbeat",
              isAdmin: state.isAdmin,
              token: state.token
            })
          });
          const data = await res.json();
          if (!data.valid) {
            clearInterval(heartbeatTimer);
            executeKickout(data.reason || "Access Key has been revoked by Administrator.");
          }
        } catch (e) {
          // Worker communication lost
        }
      }, 3000);
    }

    // -------------------------------------------------------------
    // AUTHENTICATION LOGIC
    // -------------------------------------------------------------
    async function attemptLogin(savedPassword = null) {
      const pass = savedPassword || document.getElementById("pass-input").value.trim();
      const errBox = document.getElementById("auth-error");
      if (!pass) {
        errBox.innerText = "Access key required.";
        return;
      }

      errBox.innerText = "Authenticating...";

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ action: "login", password: pass })
        });

        const data = await res.json();

        if (res.ok && data.success) {
          state.isAdmin = data.isAdmin;
          state.token = data.token;
          state.guestName = data.guestName || "Admin";
          state.clientIP = data.clientIP || "Local";
          state.notes = data.notes || { subjects: [] };

          localStorage.setItem("session_key", pass);

          document.getElementById("auth-screen").style.display = "none";
          document.getElementById("app-container").style.display = "block";

          if (state.isAdmin) {
            document.getElementById("admin-bar").style.display = "block";
            document.querySelectorAll(".admin-only").forEach(el => el.style.display = "inline-flex");
            document.getElementById("user-badge").innerText = "Logged in: Master Admin";
          } else {
            document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
            document.getElementById("user-badge").innerText = `Access Granted: ${state.guestName}`;
            generateWatermarkGrid(state.guestName, state.clientIP);
          }

          renderSubjects();
          startHeartbeat();
        } else {
          localStorage.removeItem("session_key");
          executeKickout(data.reason || "Unauthorized Access");
        }
      } catch (err) {
        errBox.innerText = "Gateway communication failed.";
      }
    }

    function logout() {
      localStorage.clear();
      window.location.reload();
    }

    // Auto-login from saved storage
    window.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("session_key");
      if (saved) attemptLogin(saved);
    });

    // -------------------------------------------------------------
    // NAVIGATION & VIEW RENDERING
    // -------------------------------------------------------------
    function updateBreadcrumbs() {
      const bar = document.getElementById("breadcrumb-bar");
      if (!state.activeSubjectId) {
        bar.innerHTML = `<span class="active">Subjects</span>`;
        return;
      }

      const currentSubj = state.notes.subjects.find(s => s.id === state.activeSubjectId);
      if (!state.activeChapterId) {
        bar.innerHTML = `<a onclick="showSubjects()">Subjects</a> &gt; <span class="active">${currentSubj.name}</span>`;
        return;
      }

      const currentChap = currentSubj.chapters.find(c => c.id === state.activeChapterId);
      bar.innerHTML = `<a onclick="showSubjects()">Subjects</a> &gt; <a onclick="showChapters()">${currentSubj.name}</a> &gt; <span class="active">${currentChap.title}</span>`;
    }

    function showSubjects() {
      state.activeSubjectId = null;
      state.activeChapterId = null;
      document.getElementById("subjects-view").style.display = "block";
      document.getElementById("chapters-view").style.display = "none";
      document.getElementById("reader-view").style.display = "none";
      updateBreadcrumbs();
      renderSubjects();
    }

    function showChapters() {
      state.activeChapterId = null;
      document.getElementById("subjects-view").style.display = "none";
      document.getElementById("chapters-view").style.display = "block";
      document.getElementById("reader-view").style.display = "none";
      updateBreadcrumbs();
      renderChapters();
    }

    function renderSubjects() {
      const grid = document.getElementById("subjects-grid");
      grid.innerHTML = "";

      state.notes.subjects.forEach(subj => {
        const card = document.createElement("div");
        card.className = "card";
        card.onclick = () => {
          state.activeSubjectId = subj.id;
          showChapters();
        };

        let actions = "";
        if (state.isAdmin) {
          actions = `
            <div class="card-actions" onclick="event.stopPropagation()">
              <button class="btn btn-outline btn-sm" onclick="renameSubject('${subj.id}')">Edit</button>
              <button class="btn btn-danger btn-sm" onclick="deleteSubject('${subj.id}')">Delete</button>
            </div>
          `;
        }

        card.innerHTML = `
          ${actions}
          <h3>${subj.name}</h3>
          <div class="card-meta">${subj.chapters.length} Chapters Indexed</div>
        `;
        grid.appendChild(card);
      });
    }

    function renderChapters() {
      const subj = state.notes.subjects.find(s => s.id === state.activeSubjectId);
      document.getElementById("current-subject-title").innerText = subj.name;
      const list = document.getElementById("chapters-list");
      list.innerHTML = "";

      subj.chapters.forEach(chap => {
        const row = document.createElement("div");
        row.className = "chapter-item";
        row.onclick = () => openReader(chap.id);

        let actions = "";
        if (state.isAdmin) {
          actions = `
            <div onclick="event.stopPropagation()" style="display:flex; gap:6px;">
              <button class="btn btn-outline btn-sm" onclick="renameChapter('${chap.id}')">Rename</button>
              <button class="btn btn-danger btn-sm" onclick="deleteChapter('${chap.id}')">Delete</button>
            </div>
          `;
        }

        row.innerHTML = `
          <div style="display:flex; align-items:center;">
            <span class="chapter-title">${chap.title}</span>
            <span class="chapter-page">Page ${chap.pageNo}</span>
          </div>
          ${actions}
        `;
        list.appendChild(row);
      });
    }

    function openReader(chapterId) {
      state.activeChapterId = chapterId;
      const subj = state.notes.subjects.find(s => s.id === state.activeSubjectId);
      const chap = subj.chapters.find(c => c.id === chapterId);

      document.getElementById("subjects-view").style.display = "none";
      document.getElementById("chapters-view").style.display = "none";
      document.getElementById("reader-view").style.display = "block";

      document.getElementById("reader-chapter-title").innerText = chap.title;
      document.getElementById("reader-page-badge").innerText = `Index Page: ${chap.pageNo}`;
      
      const contentArea = document.getElementById("note-content");
      contentArea.innerText = chap.content || "";

      // Allow admin inline editing
      if (state.isAdmin) {
        contentArea.setAttribute("contenteditable", "true");
        contentArea.oninput = () => {
          chap.content = contentArea.innerText;
        };
      } else {
        contentArea.setAttribute("contenteditable", "false");
      }

      updateBreadcrumbs();
    }

    // -------------------------------------------------------------
    // FONT SCYLING CONTROLS
    // -------------------------------------------------------------
    function changeFontSize(val) {
      document.documentElement.style.setProperty("--reader-size", val + "px");
    }

    function toggleBold() {
      state.isBold = !state.isBold;
      document.documentElement.style.setProperty("--reader-weight", state.isBold ? "700" : "400");
    }

    // -------------------------------------------------------------
    // ADMIN CRUD: SUBJECTS & CHAPTERS
    // -------------------------------------------------------------
    function createSubject() {
      const name = prompt("Enter Subject Name:");
      if (!name) return;
      state.notes.subjects.push({
        id: "subj-" + Date.now(),
        name: name.trim(),
        chapters: []
      });
      renderSubjects();
    }

    function renameSubject(id) {
      const subj = state.notes.subjects.find(s => s.id === id);
      const name = prompt("Rename Subject:", subj.name);
      if (!name) return;
      subj.name = name.trim();
      renderSubjects();
    }

    function deleteSubject(id) {
      if (!confirm("Are you sure you want to delete this entire subject and all its chapters?")) return;
      state.notes.subjects = state.notes.subjects.filter(s => s.id !== id);
      renderSubjects();
    }

    function createChapter() {
      const title = prompt("Enter Chapter Title:");
      if (!title) return;
      const pageNo = prompt("Enter Page Number / Reference:", "1") || "1";
      const subj = state.notes.subjects.find(s => s.id === state.activeSubjectId);
      subj.chapters.push({
        id: "chap-" + Date.now(),
        title: title.trim(),
        pageNo: pageNo.trim(),
        content: "Write note content here..."
      });
      renderChapters();
    }

    function renameChapter(id) {
      const subj = state.notes.subjects.find(s => s.id === state.activeSubjectId);
      const chap = subj.chapters.find(c => c.id === id);
      const title = prompt("Rename Chapter Title:", chap.title);
      if (!title) return;
      const pageNo = prompt("Update Page Number:", chap.pageNo);
      chap.title = title.trim();
      if (pageNo) chap.pageNo = pageNo.trim();
      renderChapters();
    }

    function deleteChapter(id) {
      if (!confirm("Delete this chapter permanently?")) return;
      const subj = state.notes.subjects.find(s => s.id === state.activeSubjectId);
      subj.chapters = subj.chapters.filter(c => c.id !== id);
      renderChapters();
    }

    async function persistAllNotes() {
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "save_notes",
            adminPassword: "only ai talk",
            notes: state.notes
          })
        });
        const data = await res.json();
        if (data.success) alert("All notes and changes successfully saved to Cloudflare KV!");
      } catch (e) {
        alert("Failed to save notes. Check network.");
      }
    }

    // -------------------------------------------------------------
    // ADMIN TEMP KEY GENERATOR & REALTIME REVOCATION
    // -------------------------------------------------------------
    async function promptCreateKey() {
      const name = prompt("Assignee / Student Name:");
      if (!name) return;
      const duration = prompt("Duration in minutes (e.g., 60 for 1 hour, 1440 for 1 day):", "60");
      if (!duration) return;

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "create_key",
            adminPassword: "only ai talk",
            name: name,
            durationMinutes: parseInt(duration),
            singleUse: false
          })
        });
        const data = await res.json();
        if (data.success) {
          alert(`Key Created Successfully!\n\nName: ${data.name}\nKey: ${data.key}\nExpires in: ${data.durationMinutes} minutes`);
          loadActiveKeys();
        }
      } catch (e) {
        alert("Failed to create temporary key.");
      }
    }

    async function toggleKeyManager() {
      const box = document.getElementById("key-table-box");
      if (box.style.display === "block") {
        box.style.display = "none";
      } else {
        box.style.display = "block";
        loadActiveKeys();
      }
    }

    async function loadActiveKeys() {
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "list_keys",
            adminPassword: "only ai talk"
          })
        });
        const data = await res.json();
        const tbody = document.getElementById("key-table-body");
        tbody.innerHTML = "";

        if (data.keys.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="color:#94a3b8; text-align:center;">No active temporary keys found.</td></tr>`;
          return;
        }

        data.keys.forEach(k => {
          const timeLeftMin = Math.max(0, Math.round((k.expiresAt - Date.now()) / 60000));
          const row = document.createElement("tr");
          row.innerHTML = `
            <td><strong>${k.name}</strong></td>
            <td><code style="color:var(--accent);">${k.key}</code></td>
            <td>${timeLeftMin} min remaining</td>
            <td>${k.lockedIP}</td>
            <td>
              <button class="btn btn-danger btn-sm" onclick="revokeKey('${k.key}')">Revoke</button>
            </td>
          `;
          tbody.appendChild(row);
        });
      } catch (e) {
        // failed to fetch keys
      }
    }

    async function revokeKey(key) {
      if (!confirm(`Revoke key ${key}? This user will be kicked immediately.`)) return;
      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "revoke_key",
            adminPassword: "only ai talk",
            keyToRevoke: key
          })
        });
        const data = await res.json();
        if (data.success) {
          loadActiveKeys();
        }
      } catch (e) {
        alert("Failed to revoke key.");
      }
    }
  </script>
</body>
